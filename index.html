<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07140e" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="나의 교사 유형을 발견하고, 성향에 맞는 놀이 추천을 받아보세요." />
    <!-- CSP는 firebase.json 의 hosting.headers 에 있다 — 여기 <meta> 로 두지 않는다.
         두 벌을 두면 한쪽만 고치는 함정이 되고, meta 로는 frame-ancestors 가 무시된다
         (GitHub Pages 는 응답 헤더를 못 붙여서 meta 로 둘 수밖에 없었고, Firebase Hosting
         으로 옮긴 이유 자체가 이것이다). 허용 출처의 근거는 firebase.json 참고. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
    <!-- Brand emblem favicon; src/lib/backgroundFavicon.ts swaps it to the grayscale
         variant while the tab is in the background, back to colour when it's active.
         That listener deliberately lives in a module rather than an inline <script>:
         the CSP above sets script-src 'self' with no hash or nonce, which blocks inline
         script outright. -->
    <link rel="icon" id="favicon" href="./favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CLASSCADE" />
    <meta property="og:title" content="CLASSCADE | 나는 어떤 교사일까 ?" />
    <meta property="og:description" content="교실 속 나만의 교사 MBTI를 찾고, 나에게 어울리는 놀이를 추천받아요 🍎🎯" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CLASSCADE — 나는 어떤 교사일까 ?" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CLASSCADE | 나는 어떤 교사일까 ?" />
    <meta name="twitter:description" content="교실 속 나만의 교사 MBTI를 찾고, 나에게 어울리는 놀이를 추천받아요 🍎🎯" />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />
    <meta name="twitter:image:alt" content="CLASSCADE — 나는 어떤 교사일까 ?" />
    <title>CLASSCADE</title>
  </head>
  <body>
    <!-- Boot splash: painted before any JS runs, so a fresh tab shows this instead of the
         app stuttering into place; App.tsx fades it out once the first frame is ready. -->
    <div id="boot-splash" style="align-items:center;background:#050c07;display:flex;flex-direction:column;gap:14px;inset:0;justify-content:center;position:fixed;transition:opacity .4s ease;z-index:9999">
      <div style="color:#e9cf7c;font-family:Georgia,serif;font-size:22px;letter-spacing:.42em;padding-left:.42em">CLASSCADE</div>
      <div style="background:rgba(233,207,124,.25);border-radius:99px;height:3px;overflow:hidden;width:150px"><div style="animation:boot-bar 1.1s ease-in-out infinite;background:#e9cf7c;border-radius:99px;height:100%;width:40%"></div></div>
      <style>@keyframes boot-bar{0%{margin-left:-40%}100%{margin-left:100%}}</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
