<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07140e" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="나의 교사 유형을 발견하고, 선택으로 우리반 게임을 완성합니다." />
    <link rel="canonical" href="__SITE_URL__/" />
    <!-- Brand emblem favicon; the inline script below swaps it to the grayscale variant
         while the tab is in the background, back to colour when it's active again. -->
    <link rel="icon" id="favicon" href="./favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      document.addEventListener('visibilitychange', function () {
        var icon = document.getElementById('favicon')
        if (icon) icon.href = document.hidden ? './favicon-32x32-gray.png' : './favicon-32x32.png'
      })
    </script>

    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CLASSCADE" />
    <meta property="og:title" content="CLASSCADE | 당신의 교실 플레이 모험이 시작됩니다" />
    <meta property="og:description" content="나의 교사 유형을 발견하고, 선택으로 우리반 게임을 완성합니다." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og/classcade-share-v2.png" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og/classcade-share-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CLASSCADE — 당신의 교실 플레이 모험이 시작됩니다" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CLASSCADE | 당신의 교실 플레이 모험이 시작됩니다" />
    <meta name="twitter:description" content="나의 교사 유형을 발견하고, 선택으로 우리반 게임을 완성합니다." />
    <meta name="twitter:image" content="__SITE_URL__/og/classcade-share-v2.png" />
    <meta name="twitter:image:alt" content="CLASSCADE — 당신의 교실 플레이 모험이 시작됩니다" />
    <title>CLASSCADE | 당신의 교실 플레이 모험이 시작됩니다</title>
  </head>
  <body>
    <!-- Boot splash: painted before any JS runs, so a fresh tab shows this instead of the
         app stuttering into place; App.tsx fades it out once the first frame is ready. -->
    <div id="boot-splash" style="align-items:center;background:#050c07;display:flex;flex-direction:column;gap:14px;inset:0;justify-content:center;position:fixed;transition:opacity .4s ease;z-index:9999">
      <div style="color:#e9cf7c;font-family:Georgia,serif;font-size:22px;letter-spacing:.42em;padding-left:.42em">CLASSCADE</div>
      <div style="background:rgba(233,207,124,.25);border-radius:99px;height:3px;overflow:hidden;width:150px"><div style="animation:boot-bar 1.1s ease-in-out infinite;background:#e9cf7c;border-radius:99px;height:100%;width:40%"></div></div>
      <style>@keyframes boot-bar{0%{margin-left:-40%}100%{margin-left:100%}}</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
