version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 2026-10-05: 한꺼번에 몰리지 않게 한도를 둔다(보안 업데이트는 별도 한도라 이 제한에
    # 막히지 않는다). 묶는 것은 개발 도구의 마이너·패치뿐 — 메이저와 프로덕션 의존성
    # (firebase 등)은 묶지 않고 개별 PR로 남겨 일부러 판단한다.
    open-pull-requests-limit: 3
    groups:
      dev-tools-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # 2026-10-10: firebase-tools 체인 전이 의존성(qs·stream-json·pubsub 등)에 걸어 두었던
    # 무시 규칙을 걷었다 — 상류가 고쳐졌거나 package.json overrides로 안전하게 고쳐서(그날
    # npm audit 0건, rules:test 통과) 전제가 사라졌고, 무시 규칙은 보안 업데이트까지 막기 때문이다.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        # 2026-10-05: TypeScript 7은 아직 올리지 않는다 — typescript-eslint(최신 8.71.0)가
        # TS 7을 지원하지 않아 npm ci가 peer 충돌(`typescript <6.1.0`)로 실패하고, 억지로
        # 설치해도 린트가 "does not support TS 7.0"으로 중단된다. 코드·테스트·빌드 산출물은
        # TS 7에서 문제없음을 확인했다(tsc 0건·vitest 통과·dist 전 파일 해시 동일).
        # typescript-eslint가 TS 7 지원판을 내면 이 항목을 지운다(그러면 Dependabot이 다시 올린다).

  # 워크플로의 액션은 커밋 SHA로 고정돼 있다(2026-10-05). 고정하면 자동 최신화가 멈추므로
  # 새 버전은 Dependabot이 SHA 갱신 PR로 알려준다 — 병합 전 PR 검사(pr-checks)가 돈다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
