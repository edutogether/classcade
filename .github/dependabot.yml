version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 2026-09-10 npm audit 잔여 8건(전부 devDependency `firebase-tools` 체인, 프로덕션
    # 번들에는 들어가지 않음 — .claude/rules/app.md "npm audit 구조적 상한" 참고)에
    # 대한 무시 규칙. firebase-tools 자체는 여기 없다 — 그건 계속 정상적으로 업데이트
    # 받아야 한다(2026-09-10에 15.28.2→15.30.0으로 이미 한 번 올렸다). 아래는 그
    # firebase-tools 안에 박혀 있는 개별 전이 의존성만 막는다.
    ignore:
      - dependency-name: "stream-json"
        # 3.x는 내부 모듈 경로(src/filters/Pick 등)가 바뀌어 firebase-tools가 구경로를
        # 참조한다 — 2026-09-10에 실제로 override 시도해 Firestore 에뮬레이터가
        # "Cannot find module" 로 즉시 깨지는 것을 재현 확인하고 되돌렸다.
        # firebase-tools가 그 참조를 갱신하면(현재 15.30.0도 여전히 구버전을 문다) 재시도한다.
      - dependency-name: "qs"
        # firebase-tools 트리 안 5곳(googleapis-common·express·body-parser·exegesis 등)에
        # 갈라져 물려 있어 override로 한 곳만 바꾸는 것이 안전하지 않다 — 상류(firebase-tools)
        # 업데이트를 기다린다.
      - dependency-name: "csv-parse"
      - dependency-name: "body-parser"
      - dependency-name: "express"
      - dependency-name: "@google-cloud/pubsub"
      - dependency-name: "@opentelemetry/core"
        # 이 다섯은 전부 firebase-tools의 CLI 전용 의존성(로컬 에뮬레이터·배포 명령에서만
        # 쓰임, 빌드 산출물에 포함 안 됨)이고, firebase-tools 최신판(15.30.0, 2026-09-10
        # 확인)도 여전히 이 구버전들을 요구한다 — firebase-tools가 올리면 재시도한다.
