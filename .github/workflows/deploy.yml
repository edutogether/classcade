name: Deploy CLASSCADE to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Firebase Hosting serves from the site root, unlike GitHub Pages which served this
      # app under /classcade/. Everything path-related is driven from these two values —
      # there is no hardcoded path prefix anywhere in src/ or index.html (audited 2026-09-09).
      VITE_SITE_URL: https://classcade-together.web.app
      VITE_BASE_PATH: /
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required Firebase secrets are set
        run: |
          # firebase.ts's own config() throws on these exact 4 keys at first Firestore
          # access, but that call is behind the pairing feature's lazy chunk — a missing
          # secret otherwise builds and deploys successfully, silently, and only breaks
          # for a real visitor who reaches the pairing screen (this happened once before,
          # 2026-08-17). Fail here instead, before spending the rest of the build.
          missing=""
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            value="${!name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing — the pairing feature would silently fail in production. Register them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Set up Java (Firestore emulator requires JDK 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: npm run rules:test

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Guard against edutogether.kr domain reclaim
        run: |
          # edutogether.kr은 edutogether/portal이 쓰는 커스텀 도메인이다(2026-08-13 이전됨).
          # GitHub Pages 배포는 이 워크플로에서 걷어냈지만 Pages 설정 자체는 아직 살아
          # 있으므로(폐지는 별도 단계), CNAME 파일이 들어오면 여전히 포털이 깨질 수 있다.
          if find public dist -maxdepth 1 -iname 'CNAME' 2>/dev/null | grep -q .; then
            echo "::error::CNAME file found in public/ or dist/ — this would reclaim edutogether.kr from edutogether/portal. Remove it before deploying."
            exit 1
          fi

      - name: Verify build artifact
        run: |
          # No 404.html here: GitHub Pages needed a copied index.html as its SPA fallback,
          # Firebase Hosting does that with the "**" rewrite in firebase.json.
          test -f dist/index.html
          test -d dist/assets
          test -f dist/privacy.html
          test -f dist/og/classcade-share-v2.png
          test -f dist/favicon.svg
          test -f dist/favicon-32x32.png
          test -f dist/apple-touch-icon.png
          test -f dist/site.webmanifest
          test "$(find dist/assets -maxdepth 1 -type f -name '*.mp3' | wc -l)" -ge 1
          test "$(find dist/assets -maxdepth 1 -type f -name '*.m4a' | wc -l)" -ge 3

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase deploy --only hosting --project classcade-together --non-interactive

      - name: Remove Firebase service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"

      - name: Smoke-check the deployed site
        run: |
          url="https://classcade-together.web.app/"
          # Hosting propagation can lag a few seconds; retry rather than fail on a cold read.
          for attempt in 1 2 3 4 5; do
            status="$(curl -s -o /tmp/smoke.html -w '%{http_code}' "$url")"
            if [ "$status" = "200" ] && grep -q '<title>CLASSCADE' /tmp/smoke.html; then
              echo "Smoke check passed (HTTP $status, title present)."
              # The whole point of moving off GitHub Pages was response headers, so a deploy
              # that silently drops them is a failed deploy.
              headers="$(curl -sI "$url")"
              for header in "content-security-policy" "x-frame-options" "x-content-type-options" "referrer-policy" "permissions-policy"; do
                if ! echo "$headers" | grep -qi "^$header:"; then
                  echo "::error::Security header missing from the deployed response: $header"
                  exit 1
                fi
              done
              echo "Security headers present."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status, retrying in 5s..."
            sleep 5
          done
          echo "::error::Deployed site failed smoke check at $url (last HTTP status: $status)"
          exit 1

  firestore-rules:
    # Deliberately independent of the deploy above: this only needs the build job to have
    # proven the rules pass the emulator suite (npm run rules:test). A failure here (e.g. a
    # service-account permission gap) must never block the site itself from deploying —
    # 2026-08-26 incident where bundling this into the build job's own steps made one failed
    # rules-deploy fail the build, silently skipping the site deploy entirely.
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase deploy --only firestore:rules --project classcade-together --non-interactive

      - name: Remove Firestore service account credentials
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-service-account.json"
