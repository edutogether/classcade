name: Publish CLASSCADE production site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classcade-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://edutogether.github.io
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Verify deployment artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/og/classcade-share-v1.png
          test -f dist/favicon.svg
          test -f dist/favicon-32x32.png
          test -f dist/apple-touch-icon.png
          test -f dist/site.webmanifest
          test "$(find dist/assets -maxdepth 1 -type f \( -name '*.ogg' -o -name '*.mp3' \) | wc -l)" -ge 2

      - name: Configure deploy key
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PAGES_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone deployment repository
        run: git clone git@github.com:edutogether/edutogether.github.io.git deployment

      - name: Synchronize production files
        run: |
          rsync -a --delete --exclude '.git' dist/ deployment/
          touch deployment/.nojekyll
          cp deployment/index.html deployment/404.html

      - name: Commit and push when changed
        run: |
          git -C deployment config user.name 'github-actions[bot]'
          git -C deployment config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git -C deployment diff --quiet --exit-code; then
            echo 'No deployment changes'
            exit 0
          fi
          git -C deployment add --all
          git -C deployment commit -m 'chore: publish classcade production site'
          git -C deployment push origin main
