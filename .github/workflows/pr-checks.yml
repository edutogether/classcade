name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Mirrors the `test` job in deploy.yml exactly — same steps, no secrets, no deploy.
    # Keep the two in sync by hand; there is no shared composite action for this yet.
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Set up Java (Firestore emulator requires JDK 21+)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: npm run rules:test

      - name: Lint
        run: npm run lint

      - name: Build (compile check)
        run: npm run build
