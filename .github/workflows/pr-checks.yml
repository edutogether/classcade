name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Mirrors the `test` job in deploy.yml exactly — same steps, no secrets, no deploy.
    # Keep the two in sync by hand; there is no shared composite action for this yet.
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Set up Java (Firestore emulator requires JDK 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: npm run rules:test

      - name: Lint
        run: npm run lint

      - name: Build (compile check)
        run: npm run build
