name: Deploy CLASSCADE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://edutogether.github.io/classcade
      VITE_BASE_PATH: /classcade/
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Set up Java (Firestore emulator requires JDK 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore rules tests
        run: npm run rules:test

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Guard against edutogether.kr domain reclaim
        run: |
          # edutogether.kr은 edutogether/portal이 쓰는 커스텀 도메인이다(2026-08-13 이전됨).
          # 이 저장소에 CNAME 파일이 하나라도 들어가면 GitHub Pages가 그 도메인을
          # 다시 이 앱으로 연결해버려 portal이 즉시 깨진다. public/에 정적 파일을
          # 넣는 게 이 앱의 일반적인 관행이라 실수로 섞여 들어올 위험이 있어 빌드
          # 단계에서 막는다.
          if find public dist -maxdepth 1 -iname 'CNAME' 2>/dev/null | grep -q .; then
            echo "::error::CNAME file found in public/ or dist/ — this would reclaim edutogether.kr from edutogether/portal. Remove it before deploying."
            exit 1
          fi

      - name: Prepare and verify Pages artifact
        run: |
          cp dist/index.html dist/404.html
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -f dist/og/classcade-share-v2.png
          test -f dist/favicon.svg
          test -f dist/favicon-32x32.png
          test -f dist/apple-touch-icon.png
          test -f dist/site.webmanifest
          test "$(find dist/assets -maxdepth 1 -type f -name '*.mp3' | wc -l)" -ge 1
          test "$(find dist/assets -maxdepth 1 -type f -name '*.m4a' | wc -l)" -ge 3

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
